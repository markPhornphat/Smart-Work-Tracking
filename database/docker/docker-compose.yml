services:
  postgres:
    image: postgres:16
    container_name: swt-postgres
    restart: unless-stopped
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DATABASE_USER:-swt}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-swt_dev_password}
      POSTGRES_DB: ${DATABASE_NAME:-smart_work_tracking}
    volumes:
      - swt_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  swt_pg_data:
    name: swt_pg_data
