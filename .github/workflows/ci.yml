name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swt
          POSTGRES_PASSWORD: swt_dev_password
          POSTGRES_DB: smart_work_tracking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swt -d smart_work_tracking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://swt:swt_dev_password@localhost:5432/smart_work_tracking?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-change-me
      JWT_REFRESH_SECRET: ci-refresh-secret-change-me
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm --filter @smart-work-tracking/database migrate:deploy

      - name: Lint
        run: pnpm --filter @smart-work-tracking/backend lint

      - name: Typecheck
        run: pnpm --filter @smart-work-tracking/backend exec tsc --noEmit

      - name: Test
        run: pnpm --filter @smart-work-tracking/backend test:coverage

      - name: Build
        run: pnpm --filter @smart-work-tracking/backend build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @smart-work-tracking/frontend lint

      - name: Build
        run: pnpm --filter @smart-work-tracking/frontend build
